name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *' # Rebuild only when a scheduled post became due (see the check job)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    if: ${{ !github.event.repository.is_template }}
    outputs:
      build: ${{ steps.pages.outputs.on == 'true' && steps.due.outputs.build || 'false' }}
    steps:
      # A site deployed with the Vercel (or Netlify) button has no GitHub Pages: skip with a notice instead of failing
      # on every push and every morning.
      - name: Is GitHub Pages turned on?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages is off::Nothing to deploy here. To publish this site on GitHub Pages, open Settings → Pages and set Source to GitHub Actions. If the site runs on Vercel or Netlify, ignore this."
          fi
      - name: Checkout
        if: github.event_name == 'schedule' && steps.pages.outputs.on == 'true'
        uses: actions/checkout@v4
      - name: Setup pnpm
        if: github.event_name == 'schedule' && steps.pages.outputs.on == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node
        if: github.event_name == 'schedule' && steps.pages.outputs.on == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Install dependencies
        if: github.event_name == 'schedule' && steps.pages.outputs.on == 'true'
        run: pnpm install
      - name: Did a post become due? (scheduled runs only)
        id: due
        if: steps.pages.outputs.on == 'true'
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          set +e
          ./node_modules/.bin/tsx scripts/due-posts.ts
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then echo "build=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 78 ]; then echo "build=false" >> "$GITHUB_OUTPUT"
          else exit "$code"; fi

  build:
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.build == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install rendercv
        run: pip install pyyaml 'rendercv[full]>=1.0'

      - name: Render CV PDF
        continue-on-error: true
        run: python3 scripts/render-cv.py

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Build
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
